name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ESP32_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
  FIGTREE_URL: https://raw.githubusercontent.com/google/fonts/main/ofl/figtree/Figtree%5Bwght%5D.ttf
  NASA_DAY_URL: https://assets.science.nasa.gov/content/dam/science/esd/eo/images/bmng/bmng-topography-bathymetry/september/world.topo.bathy.200409.3x5400x2700.jpg
  NASA_NIGHT_URL: https://assets.science.nasa.gov/content/dam/science/esd/eo/images/imagerecords/144000/144898/BlackMarble_2016_3km.jpg
  GEONAMES: https://download.geonames.org/export/dump

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_URL"
          arduino-cli core install esp32:esp32 --additional-urls "$ESP32_URL"
          arduino-cli lib install "GFX Library for Arduino" XPT2046_Touchscreen ArduinoJson WiFiManager
      - name: Generate fonts, map pictures and set version
        run: |
          pip install pillow
          curl -sSL -o Figtree.ttf "$FIGTREE_URL"
          python tools/make_fonts.py Figtree.ttf firmware/DeskCYD/fonts.h
          curl -fsSL --retry 3 -o day.jpg "$NASA_DAY_URL"
          curl -fsSL --retry 3 -o night.jpg "$NASA_NIGHT_URL"
          python tools/make_map.py day.jpg night.jpg firmware/DeskCYD/mapdata.h preview
          sed -i "s/^#define FW_VERSION 0$/#define FW_VERSION ${GITHUB_RUN_NUMBER}/" firmware/DeskCYD/DeskCYD.ino
          grep -n "define FW_VERSION" firmware/DeskCYD/DeskCYD.ino
      - name: Compile
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs \
            --additional-urls "$ESP32_URL" --output-dir build firmware/DeskCYD
          ls -la build
      - name: Make single flashable image
        run: |
          if [ -f build/DeskCYD.ino.merged.bin ]; then
            cp build/DeskCYD.ino.merged.bin DeskCYD.bin
          else
            pip install esptool
            BOOT_APP0=$(find ~/.arduino15 -name boot_app0.bin | head -1)
            python -m esptool --chip esp32 merge_bin -o DeskCYD.bin \
              --flash_mode dio --flash_freq 40m --flash_size 4MB \
              0x1000 build/DeskCYD.ino.bootloader.bin \
              0x8000 build/DeskCYD.ino.partitions.bin \
              0xe000 "$BOOT_APP0" \
              0x10000 build/DeskCYD.ino.bin
          fi
          cp build/DeskCYD.ino.bin DeskCYD-app.bin
          ls -la DeskCYD-app.bin
      - name: Draw page previews (same layout code, run on the PC)
        run: |
          cd tools/preview
          cp ../../firmware/DeskCYD/{canvas.h,ui.h,fonts.h,mapdata.h} .
          g++ -O2 -I. preview.cpp -o preview && ./preview
          python -c "import glob; from PIL import Image; [Image.open(f).resize((640, 480), Image.NEAREST).save('../../preview/' + f[:-4] + '.png') for f in glob.glob('*.ppm')]"
          ls -la ../../preview
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            DeskCYD.bin
            DeskCYD-app.bin
            preview/*.png

  pc-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install winsdk pillow pystray pyinstaller
      - name: Font and version
        shell: bash
        run: |
          curl -sSL -o pc/Figtree.ttf "$FIGTREE_URL"
          curl -fsSL --retry 3 -o cities15000.zip "$GEONAMES/cities15000.zip"
          curl -fsSL --retry 3 -o admin1CodesASCII.txt "$GEONAMES/admin1CodesASCII.txt"
          curl -fsSL --retry 3 -o countryInfo.txt "$GEONAMES/countryInfo.txt"
          python -c "import zipfile; zipfile.ZipFile('cities15000.zip').extractall()"
          python tools/make_cities.py cities15000.txt admin1CodesASCII.txt countryInfo.txt pc/cities.json.gz
          sed -i "s/^APP_VERSION = 0 /APP_VERSION = ${GITHUB_RUN_NUMBER} /" pc/deskcyd.py
          grep -n "^APP_VERSION" pc/deskcyd.py
      - name: Build DeskCYD.exe
        run: pyinstaller --onefile --noconsole --name DeskCYD --hidden-import pystray._win32 --add-data "pc/Figtree.ttf;." --add-data "pc/cities.json.gz;." pc/deskcyd.py
      - uses: actions/upload-artifact@v4
        with:
          name: pc-app
          path: dist/DeskCYD.exe

  site:
    needs: [firmware, pc-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Assemble site
        run: |
          mkdir site
          cp web/* site/
          cp dl/firmware/DeskCYD.bin dl/firmware/DeskCYD-app.bin site/
          cp dl/pc-app/DeskCYD.exe site/
          mkdir -p site/preview && cp dl/firmware/preview/*.png site/preview/
          echo "{\"version\": ${GITHUB_RUN_NUMBER}}" > site/version.json
          # keep the last known-good simple version (v9) available as a fallback
          LIVE=https://proxyproto66-boop.github.io/deskcyd
          if curl -sfL -o site/DeskCYD-fallback.bin "$LIVE/DeskCYD-fallback.bin"; then
            echo "kept existing fallback"
          else
            curl -sfL -o site/DeskCYD-fallback.bin "$LIVE/DeskCYD.bin" && echo "saved current live build as fallback"
          fi
          sed -i "s/__VERSION__/${GITHUB_RUN_NUMBER}/g" site/manifest.json site/index.html
          ls -la site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
